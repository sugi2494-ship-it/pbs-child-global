<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',sans-serif;background:#ddd}
.hl{width:1080px;height:1080px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff}
.hl .in{width:720px;height:720px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;position:relative;z-index:2}
.hl .en{font-family:Arial;font-weight:900;font-size:40px;letter-spacing:.12em;opacity:.85}
.hl .ko{font-size:92px;font-weight:800;letter-spacing:-.02em;margin-top:14px;word-break:keep-all;line-height:1.1}
.hl .blob{position:absolute;width:980px;height:980px;border-radius:62% 38% 55% 45%/48% 60% 40% 52%;background:radial-gradient(circle at 35% 35%,#FBE3FE 0%,#F6ACFD 48%,#E86BF5 100%)}
</style></head><body>
<div class="hl" id="h1"><div class="blob"></div><div class="in" style="color:#4A0E78"><div class="en">TEST</div><div class="ko">진단하기</div></div></div>
<div class="hl" id="h2"><div class="in" style="background:#E0A400"><div class="en">REVIEW</div><div class="ko">학부모<br>후기</div></div></div>
<div class="hl" id="h3"><div class="in" style="background:#2C66A8"><div class="en">COURSE</div><div class="ko">강사<br>과정</div></div></div>
<div class="hl" id="h4"><div class="in" style="background:#2C8C5A"><div class="en">PARTNERS</div><div class="ko">기업 ·<br>기관</div></div></div>
<div class="hl" id="h5" style="background:#15161A"><div class="in" style="background:#15161A;border:10px solid #E466F2"><div class="en" style="color:#E466F2">CEO</div><div class="ko">최해숙</div></div></div>
</body></html>
