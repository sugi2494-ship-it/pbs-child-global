<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
:root{--ink:#1B1519;--night:#1E1720;--sub:#6A5F66;--hair:#E7DFE4;--wash:#F7F3F5;--mag:#D1006F;--mag-t:#FCE3EF;--pink:#FF7DBE;
--red:#D23B30;--yel:#E0A400;--grn:#2C8C5A;--blu:#2C66A8;--serif:"Noto Serif KR",serif;--sans:"Noto Sans KR",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:var(--sans);color:var(--ink);word-break:keep-all}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;padding:150px 96px 150px;display:flex;flex-direction:column;justify-content:center;background:#fff}
.hd{position:absolute;top:58px;left:96px;right:96px;display:flex;justify-content:space-between;font:700 24px var(--sans);letter-spacing:.1em;color:var(--sub)}
.ft{position:absolute;bottom:56px;left:96px;right:96px;display:flex;justify-content:space-between;align-items:center;font:500 24px var(--sans);color:var(--sub)}
.bars{display:flex;gap:8px}.bars i{display:block;width:36px;height:8px;border-radius:4px}
.dark{background:var(--night);color:#fff}.dark .hd,.dark .ft{color:#B9AAB4}
.lab{font:700 28px var(--sans);letter-spacing:.06em;color:var(--mag)}
.dark .lab{color:var(--pink)}
.h{font:900 68px/1.32 var(--sans);letter-spacing:-.03em;margin-top:20px}
.h em{font-style:normal;color:var(--mag)}
.dark .h em{color:var(--pink)}
.p{font:500 40px/1.72 var(--sans);color:#3A3037;margin-top:40px}
.dark .p{color:#D9CED5}
.p b{color:var(--ink);font-weight:700}.dark .p b{color:#fff}

/* 1 표지: 사진 + 훅 */
.cover{padding:0;justify-content:flex-end;background:#111}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,10,14,.0) 30%,rgba(15,10,14,.55) 55%,rgba(15,10,14,.92) 80%)}
.cover .in{position:relative;padding:0 88px 150px}
.cover.top{justify-content:flex-start}
.cover.top .shade{background:linear-gradient(0deg,rgba(15,10,14,0) 45%,rgba(15,10,14,.62) 64%,rgba(15,10,14,.97) 86%),linear-gradient(180deg,rgba(15,10,14,0) 82%,rgba(15,10,14,.55) 100%)}
.cover.top .in{padding:120px 88px 0}
.cover.top .ai{top:auto;bottom:112px}
.chip{display:inline-block;background:var(--mag);color:#fff;font:700 27px var(--sans);letter-spacing:.04em;padding:12px 22px;border-radius:10px}
.cover .h{color:#fff;font-size:92px;line-height:1.22;margin-top:30px;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.cover .h em{color:var(--pink)}
.cover .sub{color:#EDE4EA;font:500 38px/1.5 var(--sans);margin-top:28px}
.cover .ft{color:#D8CCD3}
.swipe{font:700 26px var(--sans);color:#fff;opacity:.9}
.ai{position:absolute;top:40px;right:44px;font:500 18px var(--sans);color:rgba(255,255,255,.6)}

/* 2 체크리스트 */
.chk{display:flex;flex-direction:column;gap:20px;margin-top:48px}
.chk div{display:flex;gap:24px;align-items:flex-start;background:var(--wash);border-radius:18px;padding:28px 32px;font:700 37px/1.45 var(--sans)}
.chk div:before{content:"";flex:0 0 38px;height:38px;margin-top:4px;border:4px solid var(--mag);border-radius:9px}
.note{margin-top:34px;font:500 30px var(--sans);color:var(--sub)}

/* 4 신호 */
.sig{display:flex;flex-direction:column;gap:26px;margin-top:50px}
.sig div{border-left:10px solid var(--mag);padding:6px 0 6px 34px}
.sig b{display:block;font:900 44px/1.4 var(--sans)}
.sig span{display:block;font:500 33px/1.6 var(--sans);color:var(--sub);margin-top:8px}

/* 5 인용 */
.mark{font:900 170px/0.7 var(--serif);color:var(--mag)}
.q{font:900 72px/1.45 var(--serif);letter-spacing:-.02em;margin-top:30px}
.src{font:500 28px var(--sans);color:#B9AAB4;margin-top:40px}

/* 6 한 문장 */
.bub{display:flex;flex-direction:column;gap:22px;margin-top:46px}
.bub div{align-self:flex-start;background:var(--mag-t);border-radius:30px 30px 30px 6px;padding:28px 36px;font:700 39px/1.45 var(--sans);color:#6B0039}
.tip{margin-top:44px;background:var(--wash);border-radius:18px;padding:30px 34px;font:500 32px/1.6 var(--sans);color:#3A3037}
.tip b{color:var(--mag)}

/* 7 주의 */
.warn{margin-top:44px;border:3px solid #4A3C46;border-radius:20px;padding:34px 38px;font:700 36px/1.6 var(--sans);color:#fff}

/* 8 마무리 */
.cta{margin-top:56px;display:flex;gap:18px}
.cta div{flex:1;background:var(--wash);border-radius:18px;padding:28px 26px;font:700 31px/1.45 var(--sans);text-align:center}
.cta div span{display:block;font-size:44px;margin-bottom:8px;color:var(--mag)}
.book{margin-top:56px;border-top:3px solid var(--hair);padding-top:32px;font:500 29px/1.65 var(--sans);color:var(--sub)}
.book b{color:var(--ink)}
</style></head><body><div id="root"></div>
<script>
const BARS='<span class="bars"><i style="background:var(--red)"></i><i style="background:var(--yel)"></i><i style="background:var(--grn)"></i><i style="background:var(--blu)"></i></span>';
function hd(n,D){return `<div class="hd"><span>PBS 컬러강점 · ${D.part}</span><span>0${n} / 08</span></div>`}
function ft(){return `<div class="ft"><span>@pbscolor_ceo</span>${BARS}</div>`}
function build(D){
  const s=[];
  s.push(`<section class="s cover ${D.textPos||''}" id="s1"><img src="${D.image}" style="${D.imgShift?`top:${D.imgShift}px;height:1350px`:''}">${D.aiLabel?'<div class="ai">AI 생성 이미지</div>':''}<div class="shade"></div>
    <div class="in"><span class="chip">PBS 컬러강점 · ${D.part} #${D.no}</span><div class="h">${D.hook}</div><div class="sub">${D.hookSub}</div></div>
    <div class="ft"><span>@pbscolor_ceo</span><span class="swipe">넘겨서 확인하기 →</span></div></section>`);
  s.push(`<section class="s" id="s2">${hd(2,D)}<div class="lab">혹시 나도?</div><div class="h">${D.check.title}</div><div class="chk">${D.check.items.map(x=>`<div>${x}</div>`).join('')}</div><div class="note">${D.check.note}</div>${ft()}</section>`);
  s.push(`<section class="s dark" id="s3">${hd(3,D)}<div class="lab">먼저 알아둘 것</div><div class="h">${D.reframe.title}</div><div class="p">${D.reframe.body}</div>${ft()}</section>`);
  s.push(`<section class="s" id="s4">${hd(4,D)}<div class="lab">${D.signals.label}</div><div class="h">${D.signals.title}</div><div class="sig">${D.signals.items.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>${ft()}</section>`);
  s.push(`<section class="s dark" id="s5">${hd(5,D)}<div class="mark">“</div><div class="q">${D.quote}</div><div class="src">— 최해숙, 『컬러강점』 ${D.chapter}</div>${ft()}</section>`);
  s.push(`<section class="s" id="s6">${hd(6,D)}<div class="lab">오늘 써 볼 한 문장</div><div class="h">${D.lines.title}</div><div class="bub">${D.lines.items.map(x=>`<div>${x}</div>`).join('')}</div><div class="tip">${D.lines.tip}</div>${ft()}</section>`);
  s.push(`<section class="s dark" id="s7">${hd(7,D)}<div class="lab">꼭 구분하세요</div><div class="h">${D.caution.title}</div><div class="p">${D.caution.body}</div><div class="warn">${D.caution.box}</div>${ft()}</section>`);
  s.push(`<section class="s" id="s8">${hd(8,D)}<div class="lab">저장해 두고 필요할 때 꺼내 보세요</div><div class="h">${D.closing}</div>
    <div class="cta"><div><span>↓</span>저장해 두기</div><div><span>↗</span>떠오르는 사람에게 보내기</div><div><span>✎</span>내 한 문장 댓글</div></div>
    <div class="book"><b>최해숙 『컬러강점』</b>(가제) ${D.chapter} 중에서<br>출간 기념회 · 11.29 (일) 오전 11시 · 강남 교보문고<br>다음 편 · ${D.next}</div>${ft()}</section>`);
  document.getElementById('root').innerHTML=s.join('');
}
</script></body></html>
